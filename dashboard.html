<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS Manager - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>🚀 VLESS Manager Dashboard</h1>
            <a href="/logout" class="btn-logout">Logout</a>
        </header>

        <div class="server-info">
            <h2>Server Information</h2>
            <div id="serverDetails"></div>
        </div>

        <div class="add-client-section">
            <h2>Add New Client</h2>
            <form id="addClientForm">
                <div class="form-group">
                    <label for="email">Email/Name</label>
                    <input type="text" id="email" placeholder="e.g., user1">
                </div>
                <div class="form-group">
                    <label for="uuid">UUID (leave empty for auto-generate)</label>
                    <input type="text" id="uuid" placeholder="Auto-generated if empty">
                </div>
                <button type="submit" class="btn-add">Add Client</button>
            </form>
        </div>

        <div class="clients-list">
            <h2>Active Clients</h2>
            <div id="clientsTable"></div>
        </div>

        <div id="configModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>VLESS Configuration</h3>
                <pre id="configText"></pre>
                <button class="btn-copy" onclick="copyConfig()">Copy Config</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function loadServerInfo() {
            const response = await fetch(`${API_BASE}/server_info`);
            const data = await response.json();
            document.getElementById('serverDetails').innerHTML = `
                <p><strong>Worker Domain:</strong> ${data.worker_domain}</p>
                <p><strong>Server Domain:</strong> ${data.server_domain}</p>
                <p><strong>Port:</strong> ${data.port}</p>
                <p><strong>Network:</strong> ${data.network}</p>
                <p><strong>Path:</strong> ${data.path}</p>
                <p><strong>TLS:</strong> ${data.tls}</p>
            `;
        }

        async function loadClients() {
            const response = await fetch(`${API_BASE}/clients`);
            const data = await response.json();
            const clientsDiv = document.getElementById('clientsTable');
            
            if (data.clients.length === 0) {
                clientsDiv.innerHTML = '<p>No clients configured yet.</p>';
                return;
            }

            let html = '<table><tr><th>Email</th><th>UUID</th><th>Flow</th><th>Actions</th></tr>';
            data.clients.forEach(client => {
                html += `
                    <tr>
                        <td>${client.email}</td>
                        <td><code>${client.id.substring(0, 8)}...</code></td>
                        <td>${client.flow || 'N/A'}</td>
                        <td>
                            <button onclick="viewConfig('${client.id}')" class="btn-view">View Config</button>
                            <button onclick="deleteClient('${client.id}')" class="btn-delete">Delete</button>
                        </td>
                    </tr>
                `;
            });
            html += '</table>';
            clientsDiv.innerHTML = html;
        }

        document.getElementById('addClientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const uuid = document.getElementById('uuid').value;

            const response = await fetch(`${API_BASE}/add_client`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: email || undefined,
                    id: uuid || undefined
                })
            });

            const data = await response.json();
            if (data.success) {
                alert('Client added successfully!');
                document.getElementById('email').value = '';
                document.getElementById('uuid').value = '';
                loadClients();
            } else {
                alert('Error adding client');
            }
        });

        async function viewConfig(clientId) {
            const modal = document.getElementById('configModal');
            const configText = document.getElementById('configText');
            
            // Generate config for this specific client
            const response = await fetch(`${API_BASE}/clients`);
            const data = await response.json();
            const client = data.clients.find(c => c.id === clientId);
            
            const serverInfo = await fetch(`${API_BASE}/server_info`);
            const server = await serverInfo.json();
            
            configText.textContent = `vless://${clientId}@${server.worker_domain}:${server.port}?encryption=none&security=tls&sni=${server.server_domain}&type=ws&path=${server.path}&flow=${client.flow || 'xtls-rprx-vision'}#${client.email}`;
            modal.style.display = 'block';
        }

        async function deleteClient(clientId) {
            if (confirm('Are you sure you want to delete this client?')) {
                await fetch(`${API_BASE}/delete_client/${clientId}`, {method: 'DELETE'});
                loadClients();
            }
        }

        function copyConfig() {
            const configText = document.getElementById('configText').textContent;
            navigator.clipboard.writeText(configText).then(() => {
                alert('Config copied to clipboard!');
            });
        }

        document.querySelector('.close').onclick = function() {
            document.getElementById('configModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('configModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Load data on page load
        loadServerInfo();
        loadClients();
    </script>
</body>
</html>
